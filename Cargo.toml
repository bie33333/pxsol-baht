[package]
name = "pxsol-baht"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
solana-account-info = "3"
solana-cpi = "3"
solana-msg = "3"
solana-program-entrypoint = "3"
solana-program-error = "3"
solana-pubkey = { version = "4.4.0", features = ["curve25519"] }
solana-rent = "4"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-sysvar = "5"
# solana-address = { version = "2", features = ["curve25519"] }

[profile.release]
overflow-checks = true